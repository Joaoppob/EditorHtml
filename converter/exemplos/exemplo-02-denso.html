<!doctype html>
<html>
<head>

<style>

  #tela {
    position: relative;

  }
  .apoio2 {

    left: 36px;

    font-size: 22px;

  .vao {
    position: absolute;
    left: 36px;
    top: 460px;
    width: 528px;
    height: 280px;
    border: 2px dashed #999999;

</head>

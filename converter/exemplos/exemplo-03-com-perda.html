<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #tela {
    position: relative;
    width: 700px;
    height: 500px;
    background: linear-gradient(135deg, #3a6ea5 0%, #e8823c 100%);
  }
  .titulo {
    position: absolute;
    left: 40px;
    top: 60px;
    width: 620px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 52px;
    line-height: 1.15;
    color: #ffffff;
  }
  .apoio {
    position: absolute;
    left: 40px;
    top: 220px;
    width: 560px;
    font-family: Arial, sans-serif;
    font-size: 22px;
    line-height: 1.2;
    color: #ffffff;
  }
</style>
</head>
<body>
  <div id="tela">
    <div class="titulo">Peça com fundo gradiente</div>
    <div class="apoio">Este exemplo tem um fundo que o conversor não sabe representar — vira perda declarada, não é fingido.</div>
  </div>
</body>
</html>

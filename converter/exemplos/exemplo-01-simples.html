<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #tela {
    position: relative;
    width: 800px;
    height: 600px;
    background: #ffffff;
  }
  .titulo {
    position: absolute;
    left: 48px;
    top: 60px;
    width: 704px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 56px;
    line-height: 1.15;
    color: #111111;
  }
  .apoio {
    position: absolute;
    left: 48px;
    top: 240px;
    width: 656px;
    font-family: Arial, sans-serif;
    font-weight: normal;
    font-size: 24px;
    line-height: 1.15;
    color: #111111;
  }
  .foto {
    position: absolute;
    left: 48px;
    top: 360px;
    width: 240px;
    height: 160px;
    object-fit: cover;
  }
</style>
</head>
<body>
  <div id="tela">
    <div class="titulo">Exemplo de peça simples</div>
    <div class="apoio">Documento HTML de teste para a prova de fidelidade do conversor.</div>
    <img class="foto" src="./fixture-imagem.png" alt="">
  </div>
</body>
</html>
